services:
  # Web UI: IFC readiness checker + requirements explainer + graph explorer.
  # Stdlib-only Python; reads the six extraction JSONs baked into the image.
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Where the "Neo4j Browser" link in the UI points.
      NEO4J_BROWSER: ${NEO4J_BROWSER:-http://localhost:7474}
    restart: unless-stopped

  # Graph database. The knowledge graph is loaded from the generated Cypher
  # (tmp/load_iso19650_kg.cypher, mounted read-only at /import) - see README.
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/changeme-please}
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - ./tmp:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-changeme-please} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  neo4j_data:
